<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{% block title %}Order{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#eff9f1', 100: '#d7f0dd', 200: '#b0e1bc',
            300: '#7fcb93', 400: '#4fb06d', 500: '#2f9650',
            600: '#227a40', 700: '#1c6135', 800: '#1a4e2d', 900: '#164026',
          },
          ink: '#0f172a',
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; background: #f4f7f5; }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  .tap { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { display: none; }
  main ul { list-style: disc; padding-left: 1.1rem; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen text-ink antialiased">

<main class="max-w-lg mx-auto pb-32">
  {% block content %}{% endblock %}
</main>

<footer class="max-w-lg mx-auto px-4 py-6 text-center">
  <p class="text-[11px] text-slate-300">Powered by Parchi</p>
</footer>

{% block extra_body %}{% endblock %}

</body>
</html>
